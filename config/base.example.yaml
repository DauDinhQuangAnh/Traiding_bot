# Offline PHASE 3 development profile. Values marked BACKTEST_REQUIRED in the
# specification are test/calibration placeholders, not production parameters.
market:
  symbol: BTC-USDT-SWAP
  environment: BACKTEST
  quote_currency: USDT
  position_mode: NET
  margin_mode: ISOLATED
  timezone: UTC
calculation:
  decimal_precision: 34
  rounding_mode: ROUND_HALF_EVEN
strategy:
  version: 0.1.0-test
  long_threshold: "65"
  short_threshold: "65"
  minimum_score_difference: "10"
  component_max_points: {TREND: "20", MOMENTUM: "20", STRUCTURE: "15", LEVEL: "20", VOLUME: "10", CONFIRMATION: "15"}
  component_evidence_weights:
    TREND: {regime_alignment: "0.4", ema_alignment: "0.3", pullback: "0.3"}
    MOMENTUM: {rsi: "0.6", rsi_slope: "0.4"}
    STRUCTURE: {market_structure: "1"}
    LEVEL: {proximity: "1"}
    VOLUME: {volume_ratio: "1"}
    CONFIRMATION: {closed_candle: "1"}
  minimum_nonzero_components: 3
  allowed_setups: [TREND_PULLBACK, SIDEWAY_MEAN_REVERSION, BREAKOUT_RETEST]
  entry_model: CLOSE_REFERENCE
  target_model: NEXT_OPPOSING_LEVEL
  trend_pullback_tolerance_atr: "0.5"
  stop: {atr_buffer: "0.25"}
  level_full_strength_distance_atr: "0.2"
  level_zero_strength_distance_atr: "1.0"
  momentum:
    rsi_bands:
      TREND_PULLBACK: {long_min: "45", long_max: "70", short_min: "30", short_max: "55"}
      SIDEWAY_MEAN_REVERSION: {long_min: "25", long_max: "45", short_min: "55", short_max: "75"}
      BREAKOUT_RETEST: {long_min: "50", long_max: "75", short_min: "25", short_max: "50"}
    rsi_slope_full: "5"
  volume: {ratio_start: "1", ratio_full: "2"}
  confirmation: {minimum_body_fraction: "0.3", minimum_rejection_wick_fraction: "0.2", long_close_location_min: "0.6", short_close_location_max: "0.4"}
  high_volatility_enabled: false
indicators:
  ema: {periods: [20, 50, 200], slope_lookback_bars: 5, stabilization_bars: 10}
  rsi: {period: 14, method: WILDER, slope_lookback_bars: 3}
  atr: {period: 14, method: WILDER, percentile_lookback_bars: 100}
  adx: {period: 14, method: WILDER}
  bollinger: {period: 20, stddev_multiplier: "2", percentile_lookback_bars: 100}
  volume: {lookback_bars: 20, statistic: MEAN}
regime:
  minimum_evidence_count: 2
  minimum_evidence_strength: "0.5"
  minimum_confidence: "0.6"
  minimum_candidate_margin: "0.1"
  conflict_tolerance: "0.15"
  required_confirmations: 2
  timeframe_weights: {15m: "0.6", 1h: "0.4"}
  trend_candidate_threshold: "0.6"
  sideway_candidate_threshold: "0.6"
  high_volatility_candidate_threshold: "0.7"
  weights:
    trend: {ema: "0.25", slope: "0.2", adx: "0.2", structure: "0.2", price_location: "0.15"}
    sideway: {range: "0.25", ema_compression: "0.2", slope_flatness: "0.2", adx_weakness: "0.2", bounded_structure: "0.15"}
    high_volatility: {atr_percentile: "0.4", bb_width_percentile: "0.3", true_range_shock: "0.3"}
  adx: {trend_start: "20", trend_full: "35", sideway_full: "15", sideway_zero: "25"}
  ema: {minimum_slope_atr: "0.05", full_slope_atr: "0.3", maximum_sideway_slope_atr: "0.08", maximum_sideway_dispersion_atr: "0.5"}
  price_location_tolerance_atr: "0.2"
  high_volatility: {atr_percentile_start: "70", atr_percentile_full: "95", bb_percentile_start: "70", bb_percentile_full: "95", true_range_atr_start: "1.5", true_range_atr_full: "3"}
levels:
  lookback_bars: {5m: 220, 15m: 220, 1h: 220}
  structure_timeframe: 15m
  swing_left_bars: 2
  swing_right_bars: 2
  structure_comparison_tolerance_atr: "0.1"
  minimum_touches: 2
  full_strength_touches: 4
  level_merge_distance_atr: "0.3"
  zone_half_width_atr: "0.15"
  minimum_level_strength: "0.25"
  support_zone_max_fraction: "0.3"
  resistance_zone_min_fraction: "0.7"
  outside_tolerance_fraction: "0.05"
  minimum_range_width_atr: "2"
  maximum_range_stale_bars: 20
  breakout_buffer_atr: "0.2"
  breakout_confirmation_bars: 2
  breakout_hold_tolerance_atr: "0.1"
  retest_tolerance_atr: "0.2"
  retest_expiry_bars: 8
risk:
  risk_per_trade: "0.01"
  target_leverage: "2"
  max_leverage: "3"
  max_position_notional: "10000"
  max_total_exposure: "10000"
  max_daily_loss: "200"
  max_daily_drawdown: "0.05"
  max_daily_trades: 5
  max_consecutive_losses: 3
  minimum_rr: "1.5"
  max_allowed_spread: "0.001"
  max_slippage: "0.002"
  cooldown_after_loss: 30m
  daily_reset_timezone: UTC
  max_open_positions: 1
  stop: {min_distance_atr: "0.5", max_distance_atr: "4", minimum_tick_multiple: "2", minimum_spread_multiple: "2"}
  margin_buffer_ratio: "0.1"
  funding_buffer_intervals: 1
  unrealized_drawdown_gate: {enabled: false, max_ratio: null}
execution:
  enabled: false
  dry_run: true
  enable_live_trading: false
  approval_ttl: 30s
  submit_timeout: 5s
  cancel_timeout: 5s
  price_deviation_tolerance: "0.002"
  partial_fill_policy: PROTECT_FILLED_AND_CANCEL_REMAINDER
  max_query_retries: 3
  retry_delay: 1s
  retry_backoff_multiplier: "2"
  max_retry_delay: 8s
protection:
  stop_order_type: STOP_MARKET
  take_profit_order_type: TAKE_PROFIT_MARKET
  ack_timeout: 5s
  require_stop_before_managing: true
  stop_failure_policy: CANCEL_REMAINDER_REDUCE_AND_HALT
  take_profit_failure_policy: RECOVER_THEN_REDUCE_AND_HALT
  max_recovery_attempts: 3
data:
  timeframes: {micro: 5m, entry: 15m, context: 1h}
  history_bars: {5m: 300, 15m: 300, 1h: 300}
  warmup_candles: {5m: 250, 15m: 250, 1h: 250}
  freshness: {candle_5m: 10m, candle_15m: 30m, candle_1h: 2h, quote: 10s, account: 30s, position: 30s, instrument_metadata: 1h}
  gap_policy: BLOCK_AND_BACKFILL
  ordering_window: 2s
  max_backfill_attempts: 3
  clock_drift_tolerance: 2s
  store_raw: true
historical:
  raw_format: CSV
  source_name: local_csv
  symbol_mapping: {BTCUSDT: BTC-USDT-SWAP, BTC-USDT-SWAP: BTC-USDT-SWAP}
  timeframe_mapping: {5m: 5m, 15m: 15m, 1h: 1h}
  column_mapping: {timestamp: timestamp, open: open, high: high, low: low, close: close, volume: volume, symbol: symbol, timeframe: timeframe, closed: closed}
  timestamp_convention: OPEN_TIME
  timestamp_unit: ISO8601
  closed_values: ["true", "1", "closed"]
  conflict_policy: FAIL
  gap_policy: FAIL
  canonical_timeframe: 5m
  parser_version: csv-v1
  normalization_version: historical-normalization-v1
  resampling_version: ohlcv-resample-v1
backtest:
  initial_equity: "10000"
  execution_timeframe: 5m
  entry_fill_policy: NEXT_M5_OPEN
  intrabar_ambiguity_policy: WORST_CASE
  modeled_spread_rate: "0.0002"
  market_slippage_rate: "0.0003"
  stop_slippage_rate: "0.0005"
  maker_fee_rate: "0.0002"
  taker_fee_rate: "0.0005"
  funding_mode: DISABLED
  funding_interval: 8h
  fixed_funding_rate: null
  allow_same_bar_exit_after_entry: true
  gap_stop_policy: OPEN_OR_STOP_WORSE
  target_gap_policy: TARGET_PRICE_NO_IMPROVEMENT
  limit_fill_policy: ASSUMED_FULL_FILL
  end_position_policy: FORCE_CLOSE_AT_FINAL_AVAILABLE_MARK
  halt_stops_run: true
  execution_model_version: backtest-execution-v1
  spread_model_version: symmetric-spread-v1
  funding_algorithm_version: perpetual-funding-v1
journal:
  backend: SQLITE
  database_path: var/trading_bot.db
  append_only: true
  require_write_before_submit: true
  busy_timeout: 5s
  retention_days: null
monitoring:
  health_interval: 30s
  reconciliation_interval: 1m
  api_error_window: 5m
  api_error_limit: 5
  alert_channels: []
  kill_switch_requires_manual_reset: true
